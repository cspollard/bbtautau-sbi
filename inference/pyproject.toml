[project]
name = "bbtautau-pairs"
version = "0.1.0"
description = "Joint amortized Bayesian inference over (mu_HH, kappa_lambda) for bb tautau using PAIRS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.13",
    "torch>=2.5",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
